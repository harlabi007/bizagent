<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BizAgent Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f0d;
    --green: #25D366;
    --pink: #FF2E8B;
    --cyan: #00E5FF;
    --lime: #C6FF00;
    --text: #F3F6F4;
    --text-dim: #8FA39A;
    --card: #121a17;
    --line: #1e2b26;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* LOGIN SCREEN */
  .login-wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 80px; }
  .login-header { display: flex; align-items: center; gap: 8px; margin-bottom: 40px; }
  .logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; display: flex; align-items: center; gap: 8px; }
  .logo-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 12px var(--lime); }
  .login-screen {
    max-width: 380px;
    margin: 60px auto 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 32px;
    text-align: center;
  }
  .login-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; margin-bottom: 8px; }
  .login-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 26px; line-height: 1.5; }
  .login-screen select, .login-screen input {
    width: 100%;
    background: #0d1512;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    margin-bottom: 14px;
  }
  .login-screen input { letter-spacing: 0.3em; text-align: center; }
  .login-btn {
    width: 100%;
    background: var(--green);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .login-error { color: var(--pink); font-size: 13px; margin-top: 12px; min-height: 16px; }
  .login-hint { font-size: 12px; color: var(--text-dim); margin-top: 18px; line-height: 1.5; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty-state h3 { font-family: 'Space Grotesk', sans-serif; color: var(--text); font-size: 18px; margin-bottom: 8px; }

  /* APP SHELL */
  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--card);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 24px 0 16px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .sidebar-logo { padding: 0 22px 24px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 0 12px; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px;
    background: none; border: none;
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px; font-weight: 600;
    cursor: pointer; text-align: left; width: 100%;
  }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  .nav-item.active { background: rgba(37,211,102,0.13); color: var(--green); }
  .nav-icon { width: 16px; text-align: center; font-size: 14px; }
  .sidebar-footer { padding: 14px 12px 0; border-top: 1px solid var(--line); margin-top: 10px; }
  .sidebar-business-label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); padding: 0 2px 6px; }
  .sidebar-select {
    width: 100%; background: #0d1512; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-family: 'Inter', sans-serif; font-size: 12.5px; margin-bottom: 10px;
  }
  .logout-btn {
    width: 100%; background: none; border: 1px solid var(--line); color: var(--pink);
    border-radius: 8px; padding: 9px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; cursor: pointer;
  }
  .logout-btn:hover { border-color: var(--pink); }

  .main-content { flex: 1; padding: 30px 34px 60px; max-width: 1000px; }
  .tab-section { display: none; }
  .tab-section.active { display: block; }
  .page-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 23px; margin-bottom: 22px; }

  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
  .kpi-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .kpi-label { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--text-dim); margin-bottom: 10px; }
  .kpi-value { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .kpi-value.pos { color: var(--green); }
  .kpi-value.neg { color: var(--pink); }
  .kpi-sub { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; margin-bottom: 20px; }
  .panel-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15.5px; margin-bottom: 18px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .panel-head .panel-title { margin-bottom: 0; }

  .download-btn, .action-btn {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600;
    color: var(--bg); background: var(--lime); border: none; border-radius: 100px;
    padding: 9px 16px; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .action-btn.secondary { background: none; border: 1px solid var(--line); color: var(--text); }
  .action-btn.danger { background: none; border: 1px solid var(--pink); color: var(--pink); }

  .chart { display: flex; align-items: flex-end; gap: 12px; height: 170px; }
  .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .chart-bars { display: flex; align-items: flex-end; gap: 4px; height: 130px; width: 100%; justify-content: center; }
  .bar { width: 11px; border-radius: 4px 4px 0 0; min-height: 2px; }
  .bar-sale { background: var(--green); }
  .bar-expense { background: var(--pink); }
  .chart-label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--text-dim); }
  .legend { display: flex; gap: 18px; margin-top: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); padding: 0 0 10px; border-bottom: 1px solid var(--line); }
  td { padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  tr:last-child td { border-bottom: none; }
  .tag { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; padding: 3px 9px; border-radius: 100px; display: inline-block; }
  .tag-sale { background: rgba(37,211,102,0.14); color: var(--green); }
  .tag-expense { background: rgba(255,46,139,0.14); color: var(--pink); }
  .amount { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .desc { color: var(--text-dim); }
  .when { color: var(--text-dim); font-size: 12px; }

  .credit-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .credit-row:last-child { border-bottom: none; }
  .credit-name { font-size: 14px; font-weight: 600; }
  .credit-amount { font-family: 'IBM Plex Mono', monospace; color: var(--pink); font-weight: 600; }
  .credit-total, .payable-total { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--text-dim); }

  .item-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .item-row:last-child { border-bottom: none; }
  .item-name { font-size: 14px; }
  .item-count { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--lime); background: rgba(198,255,0,0.1); padding: 3px 9px; border-radius: 100px; }
  .item-count.low { color: var(--pink); background: rgba(255,46,139,0.14); }

  .payable-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .payable-row:last-child { border-bottom: none; }
  .payable-name { font-size: 14px; font-weight: 600; }
  .payable-reason { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .payable-amount { font-family: 'IBM Plex Mono', monospace; color: var(--cyan); font-weight: 600; }

  .profile-field { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); gap: 16px; }
  .profile-field:last-child { border-bottom: none; }
  .profile-label { color: var(--text-dim); font-size: 13px; }
  .profile-value { font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; text-align: right; word-break: break-word; }

  .tax-result { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }
  .tax-loading { color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; margin-top: 14px; }

  .settings-row { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .settings-sub { font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; line-height: 1.5; }
  .settings-pin-display { font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.2em; color: var(--lime); margin: 10px 0; }

  .chat-panel-log { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; padding: 4px 2px 14px; }
  .chat-panel-msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }
  .chat-panel-msg.in { align-self: flex-start; background: #16211c; border-bottom-left-radius: 4px; }
  .chat-panel-msg.out { align-self: flex-end; background: #1f5c3a; border-bottom-right-radius: 4px; }
  .chat-panel-msg.typing { align-self: flex-start; background: #16211c; border-bottom-left-radius: 4px; color: var(--text-dim); font-style: italic; }
  .chat-panel-input-row { display: flex; align-items: center; gap: 10px; }
  .chat-panel-input { flex: 1; background: #0d1512; border: 1px solid var(--line); border-radius: 100px; padding: 11px 16px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13.5px; }
  .chat-panel-input:focus { outline: none; border-color: var(--green); }
  .chat-panel-send { width: 40px; height: 40px; border-radius: 50%; background: var(--green); border: none; color: #05130d; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .chat-panel-send:disabled { opacity: 0.5; cursor: default; }

  .loading { text-align: center; padding: 80px 0; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 13px; }

  @media (max-width: 860px) {
    .app-shell { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; align-items: center; padding: 14px; gap: 12px; overflow-x: auto; }
    .sidebar-logo { padding: 0; }
    .sidebar-nav { flex-direction: row; overflow-x: auto; padding: 0; }
    .nav-item { white-space: nowrap; }
    .sidebar-footer { display: none; }
    .main-content { padding: 20px 16px 50px; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div id="root">
  <div class="login-wrap">
    <div class="login-header"><div class="logo"><span class="logo-dot"></span>BizAgent</div></div>
    <div id="loginArea"><div class="loading">Loading...</div></div>
  </div>
</div>

<script>
  const state = { businesses: [], currentId: null, dashboardData: null };

  function getUnlockedId() { return sessionStorage.getItem('bizagent_unlocked_id'); }
  function setUnlocked(id, pin) {
    sessionStorage.setItem('bizagent_unlocked_id', id);
    sessionStorage.setItem('bizagent_unlocked_pin', pin);
  }
  function clearUnlocked() {
    sessionStorage.removeItem('bizagent_unlocked_id');
    sessionStorage.removeItem('bizagent_unlocked_pin');
  }
  function getUnlockedPin() { return sessionStorage.getItem('bizagent_unlocked_pin'); }

  async function init() {
    const res = await fetch('/api/businesses');
    const businesses = await res.json();
    state.businesses = businesses;

    if (!businesses.length) {
      document.getElementById('loginArea').innerHTML = emptyState(
        'No businesses yet',
        'Once a shop owner sets up BizAgent, their business will show up here.'
      );
      return;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const linkBizId = urlParams.get('biz');
    const linkPin = urlParams.get('pin');

    if (linkBizId && linkPin) {
      const verifyRes = await fetch(`/api/businesses/${linkBizId}/verify-pin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: linkPin })
      });
      const verifyResult = await verifyRes.json();
      window.history.replaceState({}, '', window.location.pathname);

      if (verifyResult.ok) {
        setUnlocked(linkBizId, linkPin);
        state.currentId = linkBizId;
        buildAppShell();
        return;
      }
    }

    const unlockedId = getUnlockedId();
    if (unlockedId && getUnlockedPin() && businesses.some((b) => b.id === unlockedId)) {
      state.currentId = unlockedId;
      buildAppShell();
    } else {
      showLoginScreen();
    }
  }

  function showLoginScreen() {
    document.getElementById('loginArea').innerHTML = `
      <div class="login-screen">
        <div class="login-title">Enter your dashboard PIN</div>
        <div class="login-sub">Your business owner received a 4-digit PIN when they set up BizAgent.</div>
        <select id="loginBusiness">
          ${state.businesses.map((b) => `<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('')}
        </select>
        <input id="loginPin" type="password" inputmode="numeric" maxlength="4" placeholder="0000" />
        <button class="login-btn" id="loginBtn">Unlock dashboard</button>
        <div class="login-error" id="loginError"></div>
        <div class="login-hint">Do not have a PIN yet? Set up a business on WhatsApp or the BizAgent website first.</div>
      </div>
    `;
    document.getElementById('loginBtn').addEventListener('click', attemptLogin);
    document.getElementById('loginPin').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') attemptLogin();
    });
  }

  async function attemptLogin() {
    const businessId = document.getElementById('loginBusiness').value;
    const pin = document.getElementById('loginPin').value.trim();
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = '';

    if (!/^\d{4}$/.test(pin)) {
      errorEl.textContent = 'Enter the 4-digit PIN.';
      return;
    }

    const res = await fetch(`/api/businesses/${businessId}/verify-pin`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin })
    });
    const result = await res.json();

    if (result.ok) {
      setUnlocked(businessId, pin);
      state.currentId = businessId;
      buildAppShell();
    } else {
      errorEl.textContent = 'Incorrect PIN. Please try again.';
    }
  }

  const NAV_ITEMS = [
    { id: 'overview', label: 'Overview', icon: '\u25A4' },
    { id: 'insights', label: 'Insights', icon: '\u2726' },
    { id: 'credits', label: 'Credits', icon: '\u20A6' },
    { id: 'inventory', label: 'Inventory', icon: '\u25A6' },
    { id: 'payments', label: 'Payments', icon: '\u21C4' },
    { id: 'tax', label: 'Tax', icon: '\u2696' },
    { id: 'chat', label: 'Chat', icon: '\u25CF' },
    { id: 'profile', label: 'Profile', icon: '\u25C9' },
    { id: 'settings', label: 'Settings', icon: '\u2699' }
  ];

  function buildAppShell() {
    document.getElementById('root').innerHTML = `
      <div class="app-shell">
        <aside class="sidebar">
          <div class="sidebar-logo"><span class="logo-dot"></span>BizAgent</div>
          <nav class="sidebar-nav" id="sidebarNav">
            ${NAV_ITEMS.map((item, i) => `
              <button class="nav-item${i === 0 ? ' active' : ''}" data-tab="${item.id}">
                <span class="nav-icon">${item.icon}</span>${item.label}
              </button>
            `).join('')}
          </nav>
          <div class="sidebar-footer">
            <div class="sidebar-business-label">Business</div>
            <select class="sidebar-select" id="businessSelect"></select>
            <button class="logout-btn" id="logoutBtn">Switch / log out</button>
          </div>
        </aside>
        <main class="main-content">
          <section class="tab-section active" id="tab-overview"><div class="loading">Loading...</div></section>
          <section class="tab-section" id="tab-insights"></section>
          <section class="tab-section" id="tab-credits"></section>
          <section class="tab-section" id="tab-inventory"></section>
          <section class="tab-section" id="tab-payments"></section>
          <section class="tab-section" id="tab-tax"></section>
          <section class="tab-section" id="tab-chat"></section>
          <section class="tab-section" id="tab-profile"></section>
          <section class="tab-section" id="tab-settings"></section>
        </main>
      </div>
    `;

    const select = document.getElementById('businessSelect');
    select.innerHTML = state.businesses
      .map((b) => `<option value="${b.id}" ${b.id === state.currentId ? 'selected' : ''}>${escapeHtml(b.name)}</option>`)
      .join('');
    select.onchange = () => {
      clearUnlocked();
      state.currentId = null;
      showLoginScreen();
    };

    document.getElementById('logoutBtn').addEventListener('click', () => {
      clearUnlocked();
      state.currentId = null;
      showLoginScreen();
    });

    document.querySelectorAll('.nav-item').forEach((btn) => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    initChatPanel();
    initInsightsTab();
    initTaxTab();
    loadDashboard(state.currentId);
  }

  function switchTab(tabId) {
    document.querySelectorAll('.nav-item').forEach((b) => b.classList.toggle('active', b.dataset.tab === tabId));
    document.querySelectorAll('.tab-section').forEach((s) => s.classList.toggle('active', s.id === 'tab-' + tabId));
  }

  async function loadDashboard(businessId) {
    const res = await fetch(`/api/businesses/${businessId}/dashboard`);
    const data = await res.json();
    state.dashboardData = data;
    renderOverview(data);
    renderCredits(data);
    renderInventory(data);
    renderPayments(data);
    renderProfile(data);
  }

  function renderOverview(data) {
    const { week, month, days, recentTransactions, topItems, inventory, outstandingCredits, pendingPayables } = data;
    const maxVal = Math.max(1, ...days.map((d) => Math.max(d.sales, d.expenses)));

    const lowStockItems = (inventory || []).filter((i) => Number(i.current_stock) <= Number(i.low_stock_threshold));
    const creditTotalForAlert = (outstandingCredits || []).reduce((s, c) => s + c.balance, 0);
    const payableTotalForAlert = (pendingPayables || []).reduce((s, p) => s + Number(p.amount), 0);

    const alerts = [];
    if (lowStockItems.length) {
      alerts.push({ tab: 'inventory', text: `${lowStockItems.length} item${lowStockItems.length > 1 ? 's' : ''} running low on stock`, color: 'var(--pink)' });
    }
    if (creditTotalForAlert > 0) {
      alerts.push({ tab: 'credits', text: `\u20a6${creditTotalForAlert.toLocaleString()} owed to you in outstanding credit`, color: 'var(--cyan)' });
    }
    if (payableTotalForAlert > 0) {
      alerts.push({ tab: 'payments', text: `\u20a6${payableTotalForAlert.toLocaleString()} in pending payments to send`, color: 'var(--lime)' });
    }
    const alertsHtml = alerts.length
      ? `<div class="panel" style="padding:16px 20px; margin-bottom:20px;">` +
        alerts.map((a) => `<div class="alert-row" data-goto="${a.tab}" style="cursor:pointer; padding:8px 0; font-size:13.5px; display:flex; align-items:center; gap:10px;"><span style="width:7px;height:7px;border-radius:50%;background:${a.color};display:inline-block;flex-shrink:0;"></span>${a.text}<span style="margin-left:auto; color:var(--text-dim); font-size:12px;">view \u2192</span></div>`).join('')
        + `</div>`
      : '';

    const chartHtml = days.map((d) => {
      const saleH = Math.round((d.sales / maxVal) * 130);
      const expH = Math.round((d.expenses / maxVal) * 130);
      return `
        <div class="chart-col">
          <div class="chart-bars">
            <div class="bar bar-sale" style="height:${saleH}px"></div>
            <div class="bar bar-expense" style="height:${expH}px"></div>
          </div>
          <div class="chart-label">${d.label}</div>
        </div>
      `;
    }).join('');

    const rowsHtml = recentTransactions.length
      ? recentTransactions.map((t) => {
          const isSale = t.type === 'sale';
          const when = new Date(t.created_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
          return `
            <tr>
              <td><span class="tag ${isSale ? 'tag-sale' : 'tag-expense'}">${isSale ? 'Sale' : 'Expense'}</span></td>
              <td class="desc">${escapeHtml(t.description || 'No description')}</td>
              <td class="amount">${isSale ? '+' : '-'}\u20a6${Number(t.amount).toLocaleString()}</td>
              <td class="when">${when}</td>
            </tr>
          `;
        }).join('')
      : `<tr><td colspan="4" class="desc">No transactions logged yet.</td></tr>`;

    const topItemsHtml = topItems && topItems.length
      ? topItems.map((i) => `<div class="item-row"><div class="item-name">${escapeHtml(i.item)}</div><div class="item-count">${i.count} sold</div></div>`).join('')
      : `<div class="desc" style="padding:8px 0;">No sales logged yet this month.</div>`;

    document.getElementById('tab-overview').innerHTML = `
      <div class="page-title">Overview</div>
      ${alertsHtml}
      <div class="panel" style="padding:16px 20px; margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="action-btn secondary quick-action-btn" data-fill="Sold 5k of rice">Log a sale</button>
        <button class="action-btn secondary quick-action-btn" data-fill="Spent 2k on transport">Log an expense</button>
        <button class="action-btn secondary quick-action-btn" data-fill="check my stock">Check stock</button>
        <button class="action-btn secondary quick-action-btn" data-fill="report">Weekly report</button>
      </div>
      <div class="eyebrow">This week</div>
      <div class="kpi-row">
        <div class="kpi-card"><div class="kpi-label">Sales</div><div class="kpi-value pos">\u20a6${week.sales.toLocaleString()}</div><div class="kpi-sub">${week.count} transactions</div></div>
        <div class="kpi-card"><div class="kpi-label">Expenses</div><div class="kpi-value neg">\u20a6${week.expenses.toLocaleString()}</div></div>
        <div class="kpi-card"><div class="kpi-label">Profit</div><div class="kpi-value ${week.profit >= 0 ? 'pos' : 'neg'}">\u20a6${week.profit.toLocaleString()}</div></div>
        <div class="kpi-card"><div class="kpi-label">Last 30 days profit</div><div class="kpi-value ${month.profit >= 0 ? 'pos' : 'neg'}">\u20a6${month.profit.toLocaleString()}</div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Last 7 days</div><a class="download-btn" href="/api/businesses/${state.currentId}/statement.pdf?pin=${encodeURIComponent(getUnlockedPin())}">Download monthly statement</a></div>
        <div class="chart">${chartHtml}</div>
        <div class="legend"><span><i style="background:var(--green)"></i>Sales</span><span><i style="background:var(--pink)"></i>Expenses</span></div>
      </div>
      <div class="panel"><div class="panel-title">Top sellers this month</div>${topItemsHtml}</div>
      <div class="panel"><div class="panel-title">Recent activity</div><table><thead><tr><th>Type</th><th>Description</th><th>Amount</th><th>When</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>
    `;

    document.querySelectorAll('.alert-row').forEach((row) => {
      row.addEventListener('click', () => switchTab(row.dataset.goto));
    });

    document.querySelectorAll('.quick-action-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        switchTab('chat');
        const chatInput = document.getElementById('chatPanelInput');
        if (chatInput) {
          chatInput.value = btn.dataset.fill;
          chatInput.focus();
        }
      });
    });
  }

  function renderCredits(data) {
    const { outstandingCredits } = data;
    const total = (outstandingCredits || []).reduce((s, c) => s + c.balance, 0);
    const html = outstandingCredits && outstandingCredits.length
      ? outstandingCredits.map((c) => `<div class="credit-row"><div class="credit-name">${escapeHtml(c.customerName)}</div><div class="credit-amount">\u20a6${c.balance.toLocaleString()}</div></div>`).join('')
        + `<div class="credit-total"><span>Total owed to business</span><span>\u20a6${total.toLocaleString()}</span></div>`
      : `<div class="desc" style="padding:8px 0;">No outstanding customer credit right now. Try saying "Chidi owes 5k for rice" in the Chat tab.</div>`;
    document.getElementById('tab-credits').innerHTML = `<div class="page-title">Customer Credit</div><div class="panel">${html}</div>`;
  }

  function renderInventory(data) {
    const { inventory } = data;
    const html = inventory && inventory.length
      ? inventory.map((i) => {
          const isLow = Number(i.current_stock) <= Number(i.low_stock_threshold);
          return `<div class="item-row"><div class="item-name">${escapeHtml(i.item_name)}</div><div class="item-count${isLow ? ' low' : ''}">${i.current_stock} ${escapeHtml(i.unit || '')}${isLow ? ' low' : ''}</div></div>`;
        }).join('')
      : `<div class="desc" style="padding:8px 0;">No stock tracked yet. Try "Restocked 20 bags of rice" in the Chat tab.</div>`;
    document.getElementById('tab-inventory').innerHTML = `<div class="page-title">Inventory</div><div class="panel">${html}</div>`;
  }

  function renderPayments(data) {
    const { pendingPayables } = data;
    const total = (pendingPayables || []).reduce((s, p) => s + Number(p.amount), 0);
    const html = pendingPayables && pendingPayables.length
      ? pendingPayables.map((p) => `<div class="payable-row"><div><div class="payable-name">${escapeHtml(p.payee_name)}</div><div class="payable-reason">${escapeHtml(p.reason || '')}</div></div><div class="payable-amount">\u20a6${Number(p.amount).toLocaleString()}</div></div>`).join('')
        + `<div class="payable-total"><span>Total pending</span><span>\u20a6${total.toLocaleString()}</span></div>`
      : `<div class="desc" style="padding:8px 0;">No pending payments right now.</div>`;
    document.getElementById('tab-payments').innerHTML = `<div class="page-title">Payments</div><div class="panel">${html}</div>`;
  }

  function renderProfile(data) {
    const p = data.profile || {};
    const created = p.createdAt ? new Date(p.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : 'Unknown';
    document.getElementById('tab-profile').innerHTML = `
      <div class="page-title">Profile</div>
      <div class="panel">
        <div class="profile-field"><div class="profile-label">Business name</div><div class="profile-value">${escapeHtml(p.name || '')}</div></div>
        <div class="profile-field"><div class="profile-label">Business type</div><div class="profile-value">${escapeHtml(p.businessType || 'general')}</div></div>
        <div class="profile-field"><div class="profile-label">Email</div><div class="profile-value">${p.email ? escapeHtml(p.email) : 'Not provided'}</div></div>
        <div class="profile-field"><div class="profile-label">Member since</div><div class="profile-value">${created}</div></div>
      </div>
    `;
  }

  function initInsightsTab() {
    document.getElementById('tab-insights').innerHTML = `
      <div class="page-title">Insights</div>
      <div class="panel">
        <div class="panel-title">Ask your agent to analyze your business</div>
        <div class="desc">These pull your real sales, expenses, and credit history, and reason over them, not a canned summary.</div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;">
          <button class="action-btn secondary insight-btn" data-q="How am I doing compared to last month?">Compared to last month</button>
          <button class="action-btn secondary insight-btn" data-q="What should I focus on this week?">What to focus on</button>
          <button class="action-btn secondary insight-btn" data-q="Is my business healthy right now?">Overall health check</button>
        </div>
        <div id="insightsResultArea"></div>
      </div>
    `;
    document.querySelectorAll('.insight-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const area = document.getElementById('insightsResultArea');
        area.innerHTML = `<div class="tax-loading">Analyzing your real data...</div>`;
        try {
          const res = await fetch(`/api/businesses/${state.currentId}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: getUnlockedPin(), message: btn.dataset.q })
          });
          const data = await res.json();
          area.innerHTML = `<div class="tax-result">${escapeHtml(data.text || data.error || 'Could not get an answer right now.')}</div>`;
        } catch (err) {
          area.innerHTML = `<div class="tax-result">Could not reach the agent, please try again.</div>`;
        }
      });
    });
  }

  function initTaxTab() {
    document.getElementById('tab-tax').innerHTML = `
      <div class="page-title">Tax Estimate</div>
      <div class="panel">
        <div class="panel-title">Nigeria's 2026 presumptive tax</div>
        <div class="desc">Get a real estimate based on your actual logged sales, not a generic calculator. This is an estimate to help you prepare, always confirm with the Nigeria Revenue Service or a tax professional before paying anything.</div>
        <button class="action-btn" id="taxEstimateBtn" style="margin-top:16px;">Get my tax estimate</button>
        <div id="taxResultArea"></div>
      </div>
    `;
    document.getElementById('taxEstimateBtn').addEventListener('click', async () => {
      const area = document.getElementById('taxResultArea');
      area.innerHTML = `<div class="tax-loading">Calculating from your real sales data...</div>`;
      try {
        const res = await fetch(`/api/businesses/${state.currentId}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: getUnlockedPin(), message: 'how much tax will I pay' })
        });
        const data = await res.json();
        area.innerHTML = `<div class="tax-result">${escapeHtml(data.text || data.error || 'Could not get an estimate right now.')}</div>`;
      } catch (err) {
        area.innerHTML = `<div class="tax-result">Could not reach the agent, please try again.</div>`;
      }
    });
  }

  let chatPanelWired = false;
  let chatPanelSending = false;

  function chatPanelBubble(text, direction) {
    const log = document.getElementById('chatPanelLog');
    const el = document.createElement('div');
    el.className = 'chat-panel-msg ' + direction;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function sendChatPanelMessage(text) {
    if (!text.trim() || chatPanelSending) return;
    chatPanelSending = true;
    const input = document.getElementById('chatPanelInput');
    const sendBtn = document.getElementById('chatPanelSend');
    chatPanelBubble(text, 'out');
    input.value = '';
    sendBtn.disabled = true;
    const typingEl = chatPanelBubble('typing...', 'typing');

    try {
      const res = await fetch(`/api/businesses/${state.currentId}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: getUnlockedPin(), message: text })
      });
      const data = await res.json();
      typingEl.remove();
      if (data.text) {
        chatPanelBubble(data.text, 'in');
        loadDashboard(state.currentId);
      } else if (data.error) {
        chatPanelBubble('The agent had a problem: ' + data.error, 'in');
      } else {
        chatPanelBubble('No response came back. Please try again.', 'in');
      }
    } catch (err) {
      typingEl.remove();
      chatPanelBubble('Could not reach the agent, check your connection and try again.', 'in');
    } finally {
      chatPanelSending = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function initChatPanel() {
    document.getElementById('tab-chat').innerHTML = `
      <div class="page-title">Chat with your agent</div>
      <div class="panel">
        <div class="chat-panel-log" id="chatPanelLog"></div>
        <div class="chat-panel-input-row">
          <input class="chat-panel-input" id="chatPanelInput" type="text" placeholder="Sold 5k of rice..." autocomplete="off" />
          <button class="chat-panel-send" id="chatPanelSend" aria-label="Send">\u2192</button>
        </div>
      </div>
    `;
    chatPanelBubble('Hi, I am your BizAgent. Try "Sold 5k of rice" or ask me anything about your business.', 'in');

    const input = document.getElementById('chatPanelInput');
    const sendBtn = document.getElementById('chatPanelSend');
    sendBtn.addEventListener('click', () => sendChatPanelMessage(input.value));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendChatPanelMessage(input.value);
    });

    initSettingsTab();
  }

  function initSettingsTab() {
    document.getElementById('tab-settings').innerHTML = `
      <div class="page-title">Settings</div>
      <div class="panel">
        <div class="settings-row">
          <div class="settings-label">Dashboard PIN</div>
          <div class="settings-sub">Used to log into this dashboard. Choose something you will actually remember, or generate a random one.</div>
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
            <input id="customPinInput" type="text" inputmode="numeric" maxlength="4" placeholder="e.g. 4821" style="width:120px; background:#0d1512; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 12px; font-family:'IBM Plex Mono', monospace; font-size:15px; letter-spacing:0.2em; text-align:center;" />
            <button class="action-btn secondary" id="setCustomPinBtn">Set this PIN</button>
          </div>
          <button class="action-btn secondary" id="regeneratePinBtn">Or generate a random PIN</button>
          <div id="pinResultArea"></div>
        </div>
        <div class="settings-row">
          <div class="settings-label">Switch business or log out</div>
          <div class="settings-sub">You will need your PIN to log back in.</div>
          <button class="action-btn danger" id="settingsLogoutBtn">Log out</button>
        </div>
      </div>
    `;

    async function submitPin(newPin) {
      const area = document.getElementById('pinResultArea');
      area.innerHTML = `<div class="tax-loading">Updating...</div>`;
      try {
        const body = { pin: getUnlockedPin() };
        if (newPin) body.newPin = newPin;
        const res = await fetch(`/api/businesses/${state.currentId}/regenerate-pin`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.pin) {
          setUnlocked(state.currentId, data.pin);
          area.innerHTML = `<div class="settings-pin-display">${data.pin}</div><div class="desc">Your new PIN, already saved. Use this next time you log in.</div>`;
        } else {
          area.innerHTML = `<div class="desc">Could not update your PIN: ${escapeHtml(data.error || 'unknown error')}</div>`;
        }
      } catch (err) {
        area.innerHTML = `<div class="desc">Could not reach the server, please try again.</div>`;
      }
    }

    document.getElementById('setCustomPinBtn').addEventListener('click', () => {
      const input = document.getElementById('customPinInput');
      const value = input.value.trim();
      if (!/^\d{4}$/.test(value)) {
        document.getElementById('pinResultArea').innerHTML = `<div class="desc">Please enter exactly 4 digits.</div>`;
        return;
      }
      submitPin(value);
    });

    document.getElementById('regeneratePinBtn').addEventListener('click', () => submitPin(null));

    document.getElementById('settingsLogoutBtn').addEventListener('click', () => {
      clearUnlocked();
      state.currentId = null;
      showLoginScreen();
    });
  }

  function emptyState(title, body) {
    return `<div class="empty-state"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(body)}</p></div>`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  init().catch((err) => {
    document.getElementById('loginArea').innerHTML = emptyState(
      'Could not load data',
      'Check that the server is running and Supabase is connected.'
    );
    console.error(err);
  });
</script>

</body>
</html>
